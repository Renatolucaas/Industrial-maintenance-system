AWSTemplateFormatVersion: '2010-09-09'

Resources:
  # SNS Topic para Notificações
  NotificacaoTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: manutencao-industrial-notificacoes
      DisplayName: Notificações Sistema Manutenção Industrial
      
  # Subscription para Email (opcional)
  EmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref NotificacaoTopic
      Protocol: email
      Endpoint: seu-email@empresa.com  # Altere para seu email

  # SQS Queue (existente)
  FilaManutencao:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: manutencao-industrial-queue
      VisibilityTimeout: 300

  # S3 Bucket (existente)
  TinyDBBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "tinydb-storage-${AWS::AccountId}"

  # Lambda Ingestão (atualizada com SNS)
  LambdaIngestao:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: manutencao-ingestao
      Runtime: python3.9
      Handler: lambda_function.lambda_handler
      Code: { ... }
      Environment:
        Variables:
          SQS_QUEUE_URL: !Ref FilaManutencao
          SNS_TOPIC_ARN: !Ref NotificacaoTopic  # NOVO

  # Lambda Processor (atualizada com SNS)
  LambdaProcessor:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: manutencao-processor
      Runtime: python3.9
      Handler: lambda_function.lambda_handler
      Code: { ... }
      Environment:
        Variables:
          S3_BUCKET: !Ref TinyDBBucket
          SNS_TOPIC_ARN: !Ref NotificacaoTopic  # NOVO

  # Permissões para Lambdas publicarem no SNS
  LambdaSNSPermission:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: LambdaSNSPublish
      Roles:
        - !GetAtt LambdaIngestao.Arn
        - !GetAtt LambdaProcessor.Arn
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - sns:Publish
            Resource: !Ref NotificacaoTopic